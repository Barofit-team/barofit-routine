name: BaroFit ECR Build and Publish

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  build-and-publish:
    uses: Barofit-team/barofit-common/.github/workflows/reusable-cd.yml@e78e24d88876bc1f833b26dc2aa096a6bf5afd67
    with:
      service: routine
      use_packages: true
    permissions:
      contents: read
      packages: read
      id-token: write
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
