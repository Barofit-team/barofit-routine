name: BaroFit ECR Build and Publish

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    uses: Barofit-team/barofit-common/.github/workflows/reusable-cd.yml@c3dbb829e20f0267c60a0634439369620c91827b
    with:
      service: routine
    permissions:
      contents: read
      id-token: write
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
