name: BaroFit ECR Build and Publish

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build application JAR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew bootJar --no-daemon --refresh-dependencies

      - name: Verify application JAR
        run: test -f build/libs/app.jar

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --progress=plain \
            -t barofit-routine:ci .

      - name: Configure AWS OIDC credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          EXPECTED="373514675861.dkr.ecr.ap-northeast-2.amazonaws.com"

          if [ "$ECR_REGISTRY" != "$EXPECTED" ]; then
            echo "Unexpected ECR registry"
            exit 1
          fi

          TAG="${GITHUB_SHA:0:7}"
          IMAGE="$ECR_REGISTRY/barofit-routine:$TAG"

          docker tag barofit-routine:ci "$IMAGE"
          docker push "$IMAGE"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Published: $IMAGE"

      - name: Bump image tag in barofit-infra
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          TAG: ${{ steps.push.outputs.tag }}
        run: |
          set -euo pipefail

          git clone --depth 1 --branch main \
            "https://x-access-token:${GH_TOKEN}@github.com/Barofit-team/barofit-infra.git" infra-repo

          cd infra-repo

          yq -i '.routine.image.tag = strenv(TAG)' infra/values-ecr-prod.yaml

          if git diff --quiet; then
            echo "Tag unchanged"
            exit 0
          fi

          git config user.name "barofit-ci"
          git config user.email "ci@barofit.local"

          git add infra/values-ecr-prod.yaml
          git commit -m "chore(cd): bump report image tag to ${TAG}"
          git push origin main
