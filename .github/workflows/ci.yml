name: CI

# ------------------------------------------------------------------------------------------
# 최소 CI 워크플로우 (barofit 백엔드 서비스 공통 템플릿)
#
# 지금 여기서 하는 일: PR이 dev 또는 main으로 들어올 때, 그리고 barofit-common이 새로 발행될 때
# (repository_dispatch) 포맷(spotlessCheck)과 단위 테스트(test)만 돌린다.
# integrationTest(Testcontainers)는 아직 포함하지 않았다 — 의도적으로 "최소" 범위로 남겨뒀다.
# CI/CD를 맡을 팀원이 아래 TODO들을 보고 필요한 순서대로 확장하면 된다.
#
# barofit-common은 GitHub Packages(com.barofit:barofit-runtime)로 발행되고, 이 레포는
# build.gradle repositories의 GitHubPackages 항목으로 그걸 직접 받는다(mavenLocal()보다 뒤에
# 선언돼 있어 로컬에서 publishToMavenLocal을 해두면 그게 먼저 잡힌다). common이 새로 발행되면
# publish.yml이 이 레포에 repository_dispatch(common-published)를 보내 아래 잡을 재실행시킨다.
# ------------------------------------------------------------------------------------------

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  repository_dispatch:
    types: [common-published]

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: 이 서비스 레포 checkout
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정/캐시
        uses: gradle/actions/setup-gradle@v4

      - name: 포맷 검사 (spotlessCheck)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew spotlessCheck --no-daemon --refresh-dependencies

      - name: 단위 테스트 (test)
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew test --no-daemon --refresh-dependencies

      # ----------------------------------------------------------------------------------
      # 여기까지가 "최소" 범위. 아래는 다음에 추가하면 좋을 것들 — 대략 우선순위 순서.
      #
      # TODO(CICD 담당자) 확장 방향:
      #
      # 1. integrationTest 잡 추가
      #    이 레포에 src/integrationTest(Testcontainers 기반)가 있다면 `./gradlew integrationTest`를
      #    추가한다. ubuntu-latest 러너엔 Docker가 기본 설치돼 있어 Testcontainers가 별도 설정
      #    없이 바로 동작한다. 단위 테스트보다 느리므로 같은 job에 이어붙이기보다, needs:로
      #    build-and-test에 의존하는 별도 job으로 분리해 가독성 있게 관리하는 걸 권장.
      #
      # 2. 캐시 최적화
      #    GitHub Packages 전환 후에도 매 실행마다 --refresh-dependencies로 SNAPSHOT을 강제
      #    재수신하고 있어 setup-gradle의 의존성 캐시 적중률이 완전하진 않다. common 쪽에
      #    고유 버전(커밋 SHA 기반 등)을 도입하면 이 플래그 없이도 정확한 최신 버전을 받을 수
      #    있어 캐시 효율이 더 좋아질 것 — 지금은 범위 밖으로 남겨둠.
      #
      # 3. 브랜치 보호 규칙과 연동 (필수 상태 검사)
      #    barofit-team 조직의 dev 브랜치 보호 규칙(1인 승인 필수)에 이 워크플로우를
      #    "Required status check"로 등록하면, 테스트가 실패한 PR은 승인과 무관하게
      #    머지가 막힌다. 저장소 Settings → Branches → dev 규칙 편집에서 이 워크플로우의
      #    job 이름(build-and-test)을 추가하면 된다.
      #
      # 4. Docker 이미지 빌드 검증
      #    실제 EKS/ArgoCD 배포 파이프라인이 생기기 전까지는 범위 밖이지만, 최소한
      #    `docker build .`가 깨지지 않는지 정도는 이 워크플로우에 추가해볼 수 있다
      #    (barofit-infra/infra/README.md의 이미지 빌드 절차 참고).
      #
      # 5. 실패 알림
      #    Slack/Discord webhook으로 CI 실패를 알리는 스텝. 팀 규모가 작을 땐 GitHub PR
      #    상태 표시만으로 충분할 수 있어 우선순위는 낮게 둠.
      # ----------------------------------------------------------------------------------
