name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  repository_dispatch:
    types: [common-published]

permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    uses: Barofit-team/barofit-common/.github/workflows/reusable-ci.yml@chore/central-reusable-ci
    permissions:
      contents: read
      packages: read